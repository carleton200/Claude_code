<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tin Heart</title>
<style>
:root{--wood:#2b1b12;--wood2:#3d2819;--panel:#4a3120;--brass:#c9a24a;--copper:#b8683a;--ember:#ff8a2a;--ink:#f3e3c3;--muted:#b9a27c}
*{box-sizing:border-box}
body{margin:0;background:var(--wood);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
header{display:flex;justify-content:space-between;align-items:baseline;padding:14px 24px;border-bottom:3px solid var(--copper);background:var(--wood2)}
h1{margin:0;font-size:1.6rem;color:var(--brass)}
#found-count{color:var(--ember);font-weight:bold}
main{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:16px;padding:16px 24px}
.panel{background:var(--panel);border:2px solid var(--brass);border-radius:10px;padding:14px;min-height:300px}
.panel h2{margin:0 0 10px;font-size:1.05rem;color:var(--brass)}
#shelf-items{display:flex;flex-wrap:wrap;gap:8px}
#shelf button{display:flex;align-items:center;gap:6px;background:var(--wood2);color:var(--ink);border:2px solid var(--copper);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
#shelf button.selected{border-color:var(--ember);box-shadow:0 0 8px var(--ember)}
#shelf button.installed{opacity:.45;filter:grayscale(1)}
#shelf button.glow{animation:glow 1.2s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 var(--ember)}40%{box-shadow:0 0 18px 6px var(--ember)}100%{box-shadow:0 0 0 transparent}}
#crucible{text-align:center;position:relative}
#slots{display:flex;gap:12px;justify-content:center;margin:12px 0}
.slot{width:110px;height:80px;border:2px dashed var(--brass);border-radius:10px;background:var(--wood);color:var(--ink);font:inherit;cursor:pointer}
.slot[data-filled]{border-style:solid;border-color:var(--ember)}
#combine{background:var(--copper);color:var(--ink);border:0;border-radius:8px;padding:8px 22px;font:inherit;cursor:pointer}
#combine:disabled{opacity:.4;cursor:not-allowed}
#message{min-height:2.6em;margin:10px 0;font-style:italic}
#hint{background:var(--wood);border-left:4px solid var(--ember);padding:8px 10px;margin:10px 0;text-align:left}
#recipe-book{text-align:left;padding-left:22px;font-size:.9rem;color:var(--muted)}
#crucible.smoke::after{content:'';position:absolute;left:50%;top:30%;width:60px;height:60px;margin-left:-30px;border-radius:50%;background:radial-gradient(#999,transparent 70%);animation:smoke .8s ease-out forwards;pointer-events:none}
@keyframes smoke{from{opacity:.9;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-60px) scale(2)}}
#companion{max-width:300px;margin:0 auto}
#companion .figure{display:block;width:100%;height:auto}
#companion .eye{fill:#3a2a1e;transition:fill .6s}
#companion .bulb{fill:#6b4426;transition:fill .6s}
#chest{display:grid;grid-template-columns:1fr 64px 1fr;grid-template-areas:"lc heart rc" "fv heart sc" ". rs .";gap:8px;align-items:center;margin-top:-4px;padding:14px 10px;background:#8a5a33;border:3px solid var(--brass);border-top:0;border-radius:0 0 26px 26px;box-shadow:inset 0 0 0 6px #6b4426}
#heart{grid-area:heart;width:56px;height:52px;justify-self:center;fill:#4a3120;stroke:var(--copper);stroke-width:1.5;transition:fill .6s}
.chest-slot{min-height:42px;padding:4px 6px;background:var(--wood);color:var(--muted);border:2px dashed var(--brass);border-radius:8px;font:inherit;font-size:.78rem;cursor:pointer}
.chest-slot[data-slot=left_chamber]{grid-area:lc}.chest-slot[data-slot=right_chamber]{grid-area:rc}
.chest-slot[data-slot=flutter_valve]{grid-area:fv}.chest-slot[data-slot=spark_core]{grid-area:sc}
.chest-slot[data-slot=rhythm_spring]{grid-area:rs}
.chest-slot[data-installed]{border-style:solid;border-color:var(--ember);color:var(--ink);background:#5a3418;box-shadow:inset 0 0 8px rgba(255,138,42,.5);cursor:default}
.chest-slot.shake{animation:shake .5s;border-color:#d64b3a}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#companion.alive .eye{fill:#ffd36b;filter:drop-shadow(0 0 4px #ffb02a)}
#companion.alive .bulb{fill:var(--ember)}
#companion.alive #heart{fill:#d64b3a;stroke:var(--ember);animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(.96)}45%{transform:scale(1.1)}}
#ending{margin-top:14px;padding:12px;text-align:center;background:var(--wood);border:2px solid var(--ember);border-radius:10px}
#ending[hidden]{display:none}
#ending p{margin:0 0 8px;line-height:1.4}
#ending.intro{animation:rise 1.2s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#play-again{background:var(--copper);color:var(--ink);border:0;border-radius:8px;padding:8px 22px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<header><h1>The Tin Heart</h1><div id="found-count">0 / 20</div></header>
<main>
<section id="shelf" class="panel"><h2>Shelf</h2><div id="shelf-items"></div></section>
<section id="crucible" class="panel"><h2>Crucible</h2>
<div id="slots"><button type="button" class="slot" id="slot-a"></button><button type="button" class="slot" id="slot-b"></button></div>
<button type="button" id="combine" disabled>Combine</button>
<div id="message"></div>
<div id="hint" hidden></div>
<h2>Recipe Book</h2><ol id="recipe-book"></ol>
</section>
<section id="companion-panel" class="panel"><h2>Companion</h2>
<div id="companion">
<svg class="figure" viewBox="0 0 200 118" aria-hidden="true">
  <line x1="100" y1="6" x2="100" y2="22" stroke="#c9a24a" stroke-width="3"/>
  <circle class="bulb" cx="100" cy="6" r="5"/>
  <rect x="58" y="22" width="84" height="62" rx="16" fill="#8a5a33" stroke="#c9a24a" stroke-width="3"/>
  <circle cx="64" cy="30" r="2.5" fill="#c9a24a"/><circle cx="136" cy="30" r="2.5" fill="#c9a24a"/>
  <circle cx="64" cy="76" r="2.5" fill="#c9a24a"/><circle cx="136" cy="76" r="2.5" fill="#c9a24a"/>
  <circle cx="82" cy="48" r="11" fill="#2b1b12" stroke="#c9a24a" stroke-width="2"/>
  <circle cx="118" cy="48" r="11" fill="#2b1b12" stroke="#c9a24a" stroke-width="2"/>
  <circle class="eye" cx="82" cy="48" r="5"/><circle class="eye" cx="118" cy="48" r="5"/>
  <path class="mouth" d="M86 70 Q100 72 114 70" fill="none" stroke="#2b1b12" stroke-width="3" stroke-linecap="round"/>
  <rect x="90" y="84" width="20" height="10" fill="#6b4426" stroke="#c9a24a" stroke-width="2"/>
  <path d="M30 118 Q30 96 58 94 H142 Q170 96 170 118" fill="#8a5a33" stroke="#c9a24a" stroke-width="3"/>
</svg>
<div id="chest">
<svg id="heart" viewBox="0 0 40 36" aria-hidden="true"><path d="M20 34 4 18C-2 11 3 1 11 2c4 0 7 3 9 6 2-3 5-6 9-6 8-1 13 9 7 16z"/></svg>
<button type="button" class="chest-slot" data-slot="left_chamber">Left Chamber</button>
<button type="button" class="chest-slot" data-slot="right_chamber">Right Chamber</button>
<button type="button" class="chest-slot" data-slot="flutter_valve">Flutter Valve</button>
<button type="button" class="chest-slot" data-slot="spark_core">Spark Core</button>
<button type="button" class="chest-slot" data-slot="rhythm_spring">Rhythm Spring</button>
</div>
</div>
<div id="ending" hidden>
<p>Tick. Tock. <em>Thump.</em> The little companion blinks its new, glowing eyes, presses a hand to its chest, and listens.</p>
<p>Somewhere inside the brass, a tin heart is beating. It looks at you as if it has always known you.</p>
<button type="button" id="play-again">Play again</button>
</div>
</section>
</main>
<script>
(function () {
  'use strict';

  // ===== DATA: items, recipes, slots (later tasks add logic and DOM below) =====
  const ITEMS = {
    brass:            { name: 'Brass',            kind: 'base',     flavor: 'A dull gold that remembers being a bell.' },
    ember:            { name: 'Ember',            kind: 'base',     flavor: 'A coal that hums when nobody is looking.' },
    quicksilver:      { name: 'Quicksilver',      kind: 'base',     flavor: 'It slips away and then politely returns.' },
    moth_wing:        { name: 'Moth Wing',        kind: 'base',     flavor: 'Dusty, soft, and secretly very proud.' },
    molten_brass:     { name: 'Molten Brass',     kind: 'material', flavor: 'Liquid sunset with a pinch of ambition.' },
    living_vapor:     { name: 'Living Vapor',     kind: 'material', flavor: 'It curls up like a cat made of steam.' },
    silver_feather:   { name: 'Silver Feather',   kind: 'material', flavor: 'Lighter than a secret, brighter than a spoon.' },
    gilded_wing:      { name: 'Gilded Wing',      kind: 'material', flavor: 'A wing that thinks it is jewellery.' },
    spark:            { name: 'Spark',            kind: 'material', flavor: 'A tiny tantrum of light.' },
    gear:             { name: 'Gear',             kind: 'material', flavor: 'Round, toothy, and always eager to turn.' },
    mirror_drop:      { name: 'Mirror Drop',      kind: 'material', flavor: 'A bead of silver that stares back.' },
    cog_shell:        { name: 'Cog Shell',        kind: 'material', flavor: 'Armour for a heart that has yet to exist.' },
    ticking_gear:     { name: 'Ticking Gear',     kind: 'material', flavor: 'It counts the seconds and mutters about them.' },
    breath:           { name: 'Breath',           kind: 'material', flavor: 'The first sigh of something not yet alive.' },
    flutter_membrane: { name: 'Flutter Membrane', kind: 'material', flavor: 'Thin as a rumour and twice as nervous.' },
    glow_glass:       { name: 'Glow Glass',       kind: 'material', flavor: 'It holds a small, patient dawn.' },
    lightning_bead:   { name: 'Lightning Bead',   kind: 'material', flavor: 'A storm, politely rolled into a pearl.' },
    left_chamber:     { name: 'Left Chamber',     kind: 'part',     flavor: 'One room of the heart, swept and ready.' },
    right_chamber:    { name: 'Right Chamber',    kind: 'part',     flavor: 'Its twin, slightly more dramatic.' },
    flutter_valve:    { name: 'Flutter Valve',    kind: 'part',     flavor: 'A door that opens and closes like an eyelash.' },
    spark_core:       { name: 'Spark Core',       kind: 'part',     flavor: 'The little sun the whole machine leans toward.' },
    rhythm_spring:    { name: 'Rhythm Spring',    kind: 'part',     flavor: 'It bounces in three-quarter time.' },
    ash:              { name: 'Ash',              kind: 'side',     flavor: 'Grey, silent, and a little insulted.' },
    firefly:          { name: 'Firefly',          kind: 'side',     flavor: 'A wandering lamp with opinions.' }
  };

  const RECIPES = [
    { a: 'brass', b: 'ember', result: 'molten_brass', hint: 'Gold that has met fire and given up its shape.' },
    { a: 'ember', b: 'quicksilver', result: 'living_vapor', hint: 'Heat wakes the metal that never sits still.' },
    { a: 'quicksilver', b: 'moth_wing', result: 'silver_feather', hint: 'What does a wing become when dipped in liquid moonlight?' },
    { a: 'brass', b: 'moth_wing', result: 'gilded_wing', hint: 'Dress the dusty wing in something golden.' },
    { a: 'ember', b: 'ember', result: 'spark', hint: 'Two coals whispering together might strike a flash.' },
    { a: 'brass', b: 'brass', result: 'gear', hint: 'Metal meeting its own reflection grows teeth.' },
    { a: 'quicksilver', b: 'quicksilver', result: 'mirror_drop', hint: 'Silver pooled with silver sees itself.' },
    { a: 'molten_brass', b: 'gear', result: 'cog_shell', hint: 'Pour the glowing gold over something with teeth.' },
    { a: 'gear', b: 'spark', result: 'ticking_gear', hint: 'Give the toothed wheel a reason to start counting.' },
    { a: 'living_vapor', b: 'moth_wing', result: 'breath', hint: 'Let the curling cloud settle on a soft wing.' },
    { a: 'silver_feather', b: 'gilded_wing', result: 'flutter_membrane', hint: 'Two wings, one bright and one gold, make a single flutter.' },
    { a: 'mirror_drop', b: 'ember', result: 'glow_glass', hint: 'Warm the silver bead until it shines from within.' },
    { a: 'spark', b: 'quicksilver', result: 'lightning_bead', hint: 'A flash that finds a liquid to ride.' },
    { a: 'cog_shell', b: 'breath', result: 'left_chamber', hint: 'A hard shell wants something to sigh inside it.' },
    { a: 'cog_shell', b: 'living_vapor', result: 'right_chamber', hint: 'The same shell, but with a restless cloud for company.' },
    { a: 'flutter_membrane', b: 'gear', result: 'flutter_valve', hint: 'Teach the trembling skin to open and close on a wheel.' },
    { a: 'lightning_bead', b: 'glow_glass', result: 'spark_core', hint: 'A caged storm and a patient dawn, joined as one small sun.' },
    { a: 'ticking_gear', b: 'silver_feather', result: 'rhythm_spring', hint: 'Let the counting wheel bounce on something light.' },
    { a: 'moth_wing', b: 'ember', result: 'ash', hint: 'What do wings do when they get too close to the coal?' },
    { a: 'breath', b: 'spark', result: 'firefly', hint: 'A sigh with a flash inside it will wander off glowing.' }
  ];

  const STARTING_ITEMS = ['brass', 'ember', 'quicksilver', 'moth_wing'];
  const HEART_SLOTS = ['left_chamber', 'right_chamber', 'flutter_valve', 'spark_core', 'rhythm_spring'];

  function findRecipe(a, b) {
    return RECIPES.find(r => (r.a === a && r.b === b) || (r.a === b && r.b === a)) || null;
  }

  // ===== END DATA =====

  // ===== LOGIC: pure state transitions, hints, persistence =====
  const SAVE_KEY = 'tinheart.v1';
  const INSTALL_HINT = 'Your parts are ready — install them in the companion\'s chest.';

  // For each heart part: the set of items on a path leading to it (itself included).
  const PART_ANCESTORS = (function () {
    const map = {};
    HEART_SLOTS.forEach(part => {
      const set = new Set([part]);
      let grew = true;
      while (grew) {
        grew = false;
        RECIPES.forEach(r => {
          if (set.has(r.result)) [r.a, r.b].forEach(id => { if (!set.has(id)) { set.add(id); grew = true; } });
        });
      }
      map[part] = set;
    });
    return map;
  })();

  function newState() {
    return { discovered: STARTING_ITEMS.slice(), installed: {}, failStreak: 0, hint: null, finished: false };
  }

  function foundCount(s) {
    return s.discovered.length - STARTING_ITEMS.length;
  }

  function pickHint(s) {
    const have = new Set(s.discovered);
    const candidates = RECIPES.filter(r => !have.has(r.result) && have.has(r.a) && have.has(r.b));
    if (!candidates.length) return INSTALL_HINT;
    const useful = candidates.find(r => HEART_SLOTS.some(p => !s.installed[p] && PART_ANCESTORS[p].has(r.result)));
    return (useful || candidates[0]).hint;
  }

  function combine(s, a, b) {
    if (!s.discovered.includes(a) || !s.discovered.includes(b)) return { state: s, outcome: 'dud', result: null };
    const recipe = findRecipe(a, b);
    if (!recipe) {
      const next = { ...s, discovered: s.discovered.slice(), installed: { ...s.installed }, failStreak: s.failStreak + 1 };
      if (next.failStreak >= 3) next.hint = pickHint(next);
      return { state: next, outcome: 'dud', result: null };
    }
    if (s.discovered.includes(recipe.result)) {
      return { state: { ...s, discovered: s.discovered.slice(), installed: { ...s.installed } }, outcome: 'known', result: recipe.result };
    }
    const next = { ...s, discovered: [...s.discovered, recipe.result], installed: { ...s.installed }, failStreak: 0, hint: null };
    return { state: next, outcome: 'new', result: recipe.result };
  }

  function install(s, item, slot) {
    const ok = item === slot && HEART_SLOTS.includes(slot) && s.discovered.includes(item) && !s.installed[slot] && !s.finished;
    if (!ok) return { state: s, ok: false };
    const installed = { ...s.installed, [slot]: item };
    const finished = HEART_SLOTS.every(p => installed[p]);
    return { state: { ...s, discovered: s.discovered.slice(), installed, finished }, ok: true };
  }

  function saveState(s) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) { /* storage unavailable */ }
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d || typeof d !== 'object' || !Array.isArray(d.discovered)) return null;
      if (!d.discovered.every(id => typeof id === 'string' && Object.prototype.hasOwnProperty.call(ITEMS, id))) return null;
      if (!STARTING_ITEMS.every(id => d.discovered.includes(id))) return null;
      if (!d.installed || typeof d.installed !== 'object' || Array.isArray(d.installed)) return null;
      if (typeof d.failStreak !== 'number') return null;
      const installed = {};
      Object.keys(d.installed).forEach(k => {
        const v = d.installed[k];
        if (HEART_SLOTS.includes(k) && v === k && d.discovered.includes(v)) installed[k] = v;
      });
      return {
        discovered: d.discovered.slice(),
        installed,
        failStreak: Number.isFinite(d.failStreak) ? Math.max(0, Math.floor(d.failStreak)) : 0,
        hint: typeof d.hint === 'string' ? d.hint : null,
        finished: HEART_SLOTS.every(p => installed[p])
      };
    } catch (e) { return null; }
  }

  function clearSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* storage unavailable */ }
  }

  window.TinHeart = { ITEMS, RECIPES, STARTING_ITEMS, HEART_SLOTS, findRecipe,
    newState, combine, install, foundCount, pickHint, saveState, loadState, clearSave };
  // ===== END LOGIC =====

  // ===== DOM LAYER: render, dispatch, event handlers =====
  const $ = id => document.getElementById(id);
  const KIND_STYLE = { base: ['#c9a24a', 'circle'], material: ['#b8683a', 'diamond'], part: ['#ff8a2a', 'square'], side: ['#8a8a8a', 'triangle'] };
  const SHAPES = {
    circle: '<circle cx="9" cy="9" r="7"/>',
    diamond: '<path d="M9 1 17 9 9 17 1 9z"/>',
    square: '<rect x="2" y="2" width="14" height="14" rx="3"/>',
    triangle: '<path d="M9 2 17 16H1z"/>'
  };
  function glyph(id) {
    const k = KIND_STYLE[ITEMS[id].kind];
    return '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" fill="' + k[0] + '" stroke="#2b1b12">' + SHAPES[k[1]] + '</svg>';
  }

  let state = loadState() || newState();
  let selected = null;
  let slots = { a: null, b: null };
  let message = '';
  let lastNew = null;
  let smokeTimer = null;
  let finishedThisSession = false;
  const shakeTimers = {};

  function render(s) {
    const shelf = $('shelf-items');
    shelf.innerHTML = '';
    s.discovered.forEach(id => {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('data-item', id);
      if (selected === id) b.classList.add('selected');
      if (s.installed[id]) { b.classList.add('installed'); b.title = 'Installed'; }
      if (lastNew === id) b.classList.add('glow');
      b.innerHTML = glyph(id) + '<span></span>';
      b.lastChild.textContent = ITEMS[id].name;
      shelf.appendChild(b);
    });
    $('found-count').textContent = foundCount(s) + ' / ' + RECIPES.length;
    ['a', 'b'].forEach(k => {
      const el = $('slot-' + k);
      if (slots[k]) { el.setAttribute('data-filled', slots[k]); el.textContent = ITEMS[slots[k]].name; }
      else { el.removeAttribute('data-filled'); el.textContent = ''; }
    });
    $('combine').disabled = !(slots.a && slots.b);
    $('message').textContent = message;
    const hint = $('hint');
    if (s.hint) { hint.textContent = s.hint; hint.hidden = false; } else { hint.textContent = ''; hint.hidden = true; }
    const book = $('recipe-book');
    book.innerHTML = '';
    RECIPES.filter(r => s.discovered.includes(r.result)).forEach(r => {
      const li = document.createElement('li');
      li.textContent = ITEMS[r.a].name + ' + ' + ITEMS[r.b].name + ' → ' + ITEMS[r.result].name;
      book.appendChild(li);
    });
    document.querySelectorAll('#chest [data-slot]').forEach(el => {
      const id = el.getAttribute('data-slot');
      if (s.installed[id]) { el.setAttribute('data-installed', s.installed[id]); el.title = ITEMS[id].name + ' (installed)'; }
      else { el.removeAttribute('data-installed'); el.title = 'Needs: ' + ITEMS[id].name; }
    });
    $('companion').classList.toggle('alive', !!s.finished);
    const ending = $('ending');
    ending.hidden = !s.finished;
    ending.classList.toggle('intro', !!s.finished && finishedThisSession);
  }

  function dispatch(next) {
    state = next;
    saveState(state);
    render(state);
  }

  $('shelf').addEventListener('click', e => {
    const b = e.target.closest('[data-item]');
    if (!b) return;
    const id = b.getAttribute('data-item');
    selected = selected === id ? null : id;
    lastNew = null;
    render(state);
  });

  ['a', 'b'].forEach(k => {
    $('slot-' + k).addEventListener('click', () => {
      if (selected) { slots[k] = selected; selected = null; }
      else if (slots[k]) slots[k] = null;
      else return;
      render(state);
    });
  });

  $('combine').addEventListener('click', () => {
    if (!slots.a || !slots.b) return;
    const r = combine(state, slots.a, slots.b);
    slots = { a: null, b: null };
    lastNew = null;
    if (r.outcome === 'new') { lastNew = r.result; message = ITEMS[r.result].flavor; }
    else if (r.outcome === 'known') message = 'You already know that one: ' + ITEMS[r.result].name + '.';
    else message = 'Nothing happens, but the crucible sends up a puff of smoke.';
    if (r.outcome === 'dud') {
      const c = $('crucible');
      c.classList.remove('smoke');
      void c.offsetWidth;
      c.classList.add('smoke');
      clearTimeout(smokeTimer);
      smokeTimer = setTimeout(() => c.classList.remove('smoke'), 800);
    }
    dispatch(r.state);
  });

  function shake(el) {
    const id = el.getAttribute('data-slot');
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
    clearTimeout(shakeTimers[id]);
    shakeTimers[id] = setTimeout(() => el.classList.remove('shake'), 500);
  }

  $('chest').addEventListener('click', e => {
    const el = e.target.closest('[data-slot]');
    if (!el || !selected) return;
    const slot = el.getAttribute('data-slot');
    const r = install(state, selected, slot);
    lastNew = null;
    if (!r.ok) {
      shake(el);
      message = state.installed[selected] ? ITEMS[selected].name + ' is already installed.'
        : 'The ' + ITEMS[slot].name + ' socket refuses that.';
      render(state);
      return;
    }
    selected = null;
    if (r.state.finished) { finishedThisSession = true; message = 'The last part clicks home…'; }
    else message = ITEMS[slot].name + ' clicks into place.';
    dispatch(r.state);
  });

  $('play-again').addEventListener('click', () => {
    clearSave();
    selected = null;
    slots = { a: null, b: null };
    message = '';
    lastNew = null;
    finishedThisSession = false;
    dispatch(newState());
  });

  render(state);
  // ===== END DOM LAYER =====
})();
</script>
</body>
</html>
